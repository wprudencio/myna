name: Build Linux AppImages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload the AppImages to (e.g. v1.3.0)"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    name: ${{ matrix.arch }} AppImage
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: sudo apt-get update && sudo apt-get install -y xz-utils

      - run: npm ci

      - run: node scripts/build-linux.mjs --arch ${{ matrix.arch }}

      - run: bash scripts/build-appimage.sh

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/Myna-*-linux-*.AppImage \
            dist/Myna-*-linux-*.AppImage.sha256 \
            --clobber
